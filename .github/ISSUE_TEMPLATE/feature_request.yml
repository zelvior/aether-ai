name: Feature request
description: Propose a concrete capability, improvement, or change in scope.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        AETHER deliberately keeps a small surface area and avoids duplicated components, so not
        every useful idea will be accepted. Please describe the problem before the solution.

        If your idea is a change in research direction, a new model design, or an experiment,
        use the **Research proposal** template instead of this one.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I have searched existing issues and the roadmap, and this is not already planned.
          required: true
        - label: This request is within the project's stated scope (CPU-first, from-scratch, portable inference).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What is difficult, missing, or inefficient today? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see happen? Be as concrete as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including doing nothing, and why they are worse.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Related component
      description: Which part of AETHER would this affect?
      options:
        - "AETHER Architecture"
        - "AETHER Tokenizer"
        - "AETHER Training"
        - "AETHER Runtime"
        - "AETHER Model Format"
        - "AETHER Evaluation"
        - "Repository / tooling / documentation"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: cost
    attributes:
      label: Expected impact on complexity and dependencies
      description: AETHER treats new dependencies and new components as costs to justify.
      options:
        - "Documentation or policy only"
        - "Small: no new dependencies"
        - "Moderate: small or optional dependency"
        - "Large: significant new code or dependency"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: portability
    attributes:
      label: Portability considerations
      description: |
        Could this be implemented without assuming a 64-bit address space? Would it need
        architecture-specific code, or a new dependency that may not build on 32-bit x86?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Prior art, references, sketches. If you cite external work, include a link.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
